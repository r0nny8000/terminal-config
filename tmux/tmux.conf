# foot and Ghostty set COLORTERM=truecolor, and fish uses 24-bit colour only
# when it is set. A tmux server keeps the environment it started with, so
# without this a pane opened after attaching from foot to an older server
# falls back to 256 colours.
set -ga update-environment COLORTERM

# Window list at the top, where it reads as a tab bar.
set -g status-position top

# Named colours, not hex, so the terminal's Tokyo Night palette fills them in.
set -g status-style bg=black,fg=white
set -g status-left-style fg=blue,bold
set -g window-status-current-style bg=blue,fg=black,bold
set -g pane-border-style fg=black
# Keeps the default's yellow for copy mode and red for synchronised panes.
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=blue}}"
