# foot and Ghostty set COLORTERM=truecolor, and fish uses 24-bit colour only
# when it is set. A tmux server keeps the environment it started with, so
# without this a pane opened after attaching from foot to an older server
# falls back to 256 colours.
set -ga update-environment COLORTERM

# Debian's foot terminfo has no RGB flag, so tmux would squeeze every 24-bit
# colour into the 256-colour palette, the fish theme included.
set -as terminal-features ',foot*:RGB'

# Window list at the top, where it reads as a tab bar.
set -g status-position top
set -g status-justify centre
set -g window-status-separator "  "
set -g automatic-rename-format "#{b:pane_current_path}"
# tmux's default format, with the last-window flag - shown as a space.
set -g window-status-format "#I:#W#{?window_flags,#{s/-/ /:window_flags}, }"
set -g base-index 1

# The default length of 10 cuts off session names like cc-<parent>/<dir>.
set -g status-left-length 60
set -g status-left " #S "
# Redrawn every second, otherwise the seconds only move every 15.
set -g status-interval 1
set -g status-right " %Y-%m-%d %H:%M:%S "

# TokyoNight Night, folke/tokyonight.nvim v4.14.1. Hex, because bg_highlight
# and bg_dark are not among the terminal's 16 colours.
# bg_highlight #292e42, fg_dark #a9b1d6, bg_dark #16161e
set -g status-style bg=#292e42,fg=#a9b1d6
set -g status-left-style bold
set -g window-status-current-style bg=#a9b1d6,fg=#292e42,bold
set -g pane-border-style fg=#16161e
# Keeps the default's yellow for copy mode and red for synchronised panes.
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=#292e42}}"
