# Tokyo Night comes from the foot-themes package, so no colours are kept here.
include=/usr/share/foot/themes/tokyonight-night

# Sized by the monitor's real pixel density, so 12 points looks the same on the
# Pi's 4K screen as on a smaller one; cage leaves the scale factor at 1, which
# made foot's default 8 points tiny at 3840x2160.
dpi-aware=yes
font=0xProto Nerd Font Mono:size=12
